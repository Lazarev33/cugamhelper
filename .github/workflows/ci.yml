name: Cugam Helper CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - run: python -m pip check
      - run: bash -n install.sh tooling/isolation_ci.sh
      - run: python -m unittest discover -v
      - run: python -m compileall -q .
      - run: python -c "import json; from infrastructure_api import create_app; assert json.load(open('docs/openapi.json')) == create_app().openapi()"
      - name: Validate test-only release
        if: matrix.python == '3.12'
        run: |
          umask 077
          openssl genpkey -algorithm ED25519 -out "$RUNNER_TEMP/cugam-ci.pem"
          openssl pkey -in "$RUNNER_TEMP/cugam-ci.pem" -pubout -out "$RUNNER_TEMP/cugam-ci.pub"
          python tooling/package_release.py HEAD "$RUNNER_TEMP/cugam-test-release" --public-key "$RUNNER_TEMP/cugam-ci.pub" --private-key "$RUNNER_TEMP/cugam-ci.pem"
          mkdir -p "$RUNNER_TEMP/cugam-trust/keys"
          key=$(python secure_release.py key-id "$RUNNER_TEMP/cugam-ci.pub")
          cp "$RUNNER_TEMP/cugam-ci.pub" "$RUNNER_TEMP/cugam-trust/keys/$key.pem"
          cp "$RUNNER_TEMP/cugam-ci.pub" "$RUNNER_TEMP/cugam-test-release/TEST-PUBLIC.pem"
          python secure_release.py --trust "$RUNNER_TEMP/cugam-trust" verify "$RUNNER_TEMP/cugam-test-release/Cugam-Helper.zip" "$RUNNER_TEMP/cugam-test-release/Cugam-Helper.manifest.json" "$RUNNER_TEMP/cugam-test-release/Cugam-Helper.manifest.sig"
          rm "$RUNNER_TEMP/cugam-ci.pem"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python == '3.12'
        with:
          name: signed-ci-test-only
          path: ${{ runner.temp }}/cugam-test-release/
      - name: Check OS isolation on an ephemeral runner
        if: matrix.python == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/security/v3.1.0'
        run: bash tooling/isolation_ci.sh
